# Generated by gitteam. Enforces branch naming, PR title and commit message conventions.
name: Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventions:
    name: Branch / PR title / commits
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
          PATTERN: '$branch_pattern'
          PROTECTED: '$protected_branches'
        run: |
          for p in $$PROTECTED; do
            if [ "$$BRANCH" = "$$p" ]; then echo "protected branch, skipping"; exit 0; fi
          done
          if printf '%s\n' "$$BRANCH" | grep -Eq "$$PATTERN"; then
            echo "branch '$$BRANCH' OK"
          else
            echo "::error::branch '$$BRANCH' does not match $$PATTERN"
            exit 1
          fi

      - name: Check PR title (Conventional Commits)
        env:
          TITLE: ${{ github.event.pull_request.title }}
          TYPES: '$commit_types_alternation'
          MAX: '$commit_subject_max'
        run: |
          if ! printf '%s\n' "$$TITLE" | grep -Eq "^($$TYPES)(\([^()[:space:]]+\))?!?: .+"; then
            echo "::error::PR title '$$TITLE' must look like '<type>(<scope>): <description>' with type in: $$TYPES"
            exit 1
          fi
          if [ $${#TITLE} -gt "$$MAX" ]; then
            echo "::error::PR title is longer than $$MAX characters"
            exit 1
          fi
          echo "PR title OK"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TYPES: '$commit_types_alternation'
          MAX: '$commit_subject_max'
        run: |
          status=0
          while IFS= read -r subject; do
            [ -z "$$subject" ] && continue
            case "$$subject" in
              "Merge "*|"Revert \""*) continue ;;
              "fixup! "*|"squash! "*)
                echo "::error::fixup/squash commit must be squashed: $$subject"; status=1; continue ;;
            esac
            if ! printf '%s\n' "$$subject" | grep -Eq "^($$TYPES)(\([^()[:space:]]+\))?!?: .+"; then
              echo "::error::invalid commit subject: $$subject"; status=1
            elif [ $${#subject} -gt "$$MAX" ]; then
              echo "::error::commit subject longer than $$MAX chars: $$subject"; status=1
            fi
          done <<EOF
          $$(git log --no-merges --format=%s "$$BASE..$$HEAD")
          EOF
          [ "$$status" -eq 0 ] && echo "commit messages OK"
          exit $$status
