name: Bug report
description: Report something that is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour (include logs / screenshots)
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "${tag_prefix}1.2.3 or commit SHA"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, runtime version, browser, ..."
