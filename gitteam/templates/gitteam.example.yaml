# gitteam configuration
# Generated by `gitteam config init`. Every key is optional except `owner`.
# Validate with `gitteam config validate`, inspect effective values with `gitteam config show`.

# GitHub organization or user login that owns the repositories.
owner: $owner

# How the team uses GitHub. Controls which features gitteam will attempt.
#   org            - Organization on the Free or Team plan
#   org-enterprise - Organization on GitHub Enterprise Cloud (rulesets, internal repos, ...)
#   personal       - Repositories under a personal account (collaborators instead of teams)
mode: $mode

# Billing plan. `auto` asks the GitHub API; override when the token cannot read it.
#   auto | free | pro | team | enterprise
plan: auto

repo:
  visibility: private          # private | public | internal (internal: org-enterprise only)
  default_branch: main
  delete_branch_on_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  allow_update_branch: true
  squash_merge_commit_title: PR_TITLE      # PR_TITLE | COMMIT_OR_PR_TITLE
  squash_merge_commit_message: PR_BODY     # PR_BODY | COMMIT_MESSAGES | BLANK
  has_issues: true
  has_wiki: false
  has_projects: false
  gitignore_templates: []      # names from https://github.com/github/gitignore, e.g. [Python, Node]
  license: null                # SPDX-like key from `gh api licenses`, e.g. mit, apache-2.0
  topics: []

# Labels synchronised to every repository (`gitteam repo labels sync`).
# Omit this key to use the built-in default set.
# labels:
#   - { name: bug,          color: d73a4a, description: 不具合・想定どおりに動作しない }
#   - { name: enhancement,  color: a2eeef, description: 新機能・機能改善の要望 }

protection:
  branches: [main]             # branch names or fnmatch patterns (patterns need engine: ruleset)
  engine: auto                 # auto | ruleset | classic
  required_approvals: 1
  dismiss_stale_reviews: true
  require_code_owner_reviews: true
  require_last_push_approval: false
  require_conversation_resolution: true
  required_linear_history: true
  require_signed_commits: false
  enforce_admins: true         # false lets repository admins bypass the rules
  status_checks: []            # e.g. ["Branch / PR title / commits", "test"]
  strict_status_checks: true   # branches must be up to date before merging
  allow_force_pushes: false
  allow_deletions: false

scaffold:
  enabled: true
  include:
    - readme
    - gitignore
    - license
    - editorconfig
    - gitattributes
    - codeowners
    - pr_template
    - issue_templates
    - contributing
    - workflows
    - githooks
  # CODEOWNERS entries. "{owner}" expands to the owner above.
  codeowners:
    "*": ["$codeowner"]

# Organization teams (modes org / org-enterprise). `repos: ["*"]` means every repo of the owner.
teams: $teams_example

# Personal mode (or additional direct access): per-repository collaborators.
collaborators: []
#  - { user: alice, permission: push, repos: ["*"] }

conventions:
  branch_types: [feature, fix, hotfix, chore, docs, refactor, test, release]
  # Left as is (or removed), the pattern follows branch_types automatically; edit it to override.
  branch_pattern: '^(feature|fix|hotfix|chore|docs|refactor|test|release)/[a-z0-9][a-z0-9._-]*$$'
  protected_branches: [main, develop]
  require_issue_in_branch: false      # true enforces <type>/<issue>-<description>
  commit_types: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
  commit_scopes: []                   # restrict allowed scopes, empty = any
  require_scope: false
  commit_subject_max: 72
  tag_prefix: v
  pr_reviewers: []                    # users or org/team requested on every PR
  pr_labels_by_type: { feat: enhancement, fix: bug, docs: documentation, chore: chore }

dev:
  git_config:
    init.defaultBranch: main
    pull.rebase: "true"
    fetch.prune: "true"
    push.autoSetupRemote: "true"
    rebase.autoStash: "true"
    rerere.enabled: "true"
    merge.conflictStyle: zdiff3
    diff.algorithm: histogram
    core.longpaths: "true"
  aliases:
    st: status -sb
    co: checkout
    sw: switch
    br: branch
    lg: log --oneline --graph --decorate --all
    last: log -1 HEAD --stat
    unstage: reset HEAD --
  line_endings: auto                  # auto (crlf on Windows / lf elsewhere) | lf | crlf
  signing: none                       # none | ssh | gpg
  shared_hooks: true                  # use .githooks via core.hooksPath when available
  repos: []                           # repositories cloned by `gitteam dev onboard`
