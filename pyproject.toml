[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitteam"
version = "0.1.0"
description = "Git/GitHub team bootstrap and operations CLI (repo setup, teams, conventions, onboarding)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "streamlit>=1.57"]
ui = ["streamlit>=1.57"]

[project.scripts]
gitteam = "gitteam.cli:run"

[tool.setuptools.packages.find]
include = ["gitteam*"]

[tool.setuptools.package-data]
gitteam = ["templates/**/*", "templates/**/.*", "templates/scaffold/.github/**/*", "templates/scaffold/.githooks/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
